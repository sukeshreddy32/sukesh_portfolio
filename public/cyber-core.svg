<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="44" stroke="url(#cyberGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8"/>
  <circle cx="50" cy="50" r="34" stroke="#00f2fe" stroke-width="1.5" opacity="0.6"/>
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" stroke="url(#cyberGrad)" stroke-width="2.5" fill="rgba(0, 242, 254, 0.05)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="8" fill="#00f2fe" filter="url(#glow)"/>
  <text x="50" y="54" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#030712" text-anchor="middle" dominant-baseline="central">S</text>
</svg>